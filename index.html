<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sosint.fun</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .brand {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    .hint {
      margin: 0;
      color: rgba(255, 255, 255, 0.55);
    }

    .spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <h1 class="brand">sosint.fun</h1>
  <div class="loading">
    <span class="spinner" role="status" aria-label="Загрузка"></span>
    <p class="hint">тут нихуя нету</p>
    <p class="hint">кошенций</p>
  </div>
</body>
</html>
