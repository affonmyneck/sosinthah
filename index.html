<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06132d">
  <title>sosint.fun</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #030b20;
      --bg-blue: #081f4b;
      --cyan: #bceeff;
      --white: rgba(255, 255, 255, 0.94);
      --panel-width: min(78vw, 980px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(42, 137, 218, 0.22) 0%, rgba(11, 47, 103, 0.12) 31%, transparent 66%),
        radial-gradient(ellipse at 12% 4%, rgba(25, 102, 190, 0.16), transparent 42%),
        linear-gradient(145deg, var(--bg-deep) 0%, #051638 49%, #020817 100%);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      content: "";
      border-radius: 50%;
      filter: blur(2px);
    }

    body::before {
      width: 34rem;
      height: 34rem;
      top: -20rem;
      right: -12rem;
      background: rgba(64, 190, 255, 0.09);
      box-shadow: 0 0 160px 80px rgba(47, 164, 255, 0.05);
    }

    body::after {
      width: 29rem;
      height: 29rem;
      bottom: -20rem;
      left: -15rem;
      background: rgba(29, 88, 202, 0.1);
      box-shadow: 0 0 140px 70px rgba(37, 138, 255, 0.04);
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100svh;
      padding: 2rem;
    }

    .brand {
      position: relative;
      z-index: 2;
      margin: 0 0 1.35rem;
      color: rgba(255, 255, 255, 0.94);
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      line-height: 1;
      text-shadow: 0 0 18px rgba(168, 231, 255, 0.45);
    }

    .glass-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--panel-width);
      min-height: clamp(13rem, 27vh, 18rem);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(220, 248, 255, 0.48);
      border-radius: 2rem;
      background: linear-gradient(135deg, rgba(185, 232, 255, 0.13), rgba(79, 143, 199, 0.055) 48%, rgba(9, 45, 91, 0.16));
      box-shadow:
        0 0 0 1px rgba(130, 218, 255, 0.09) inset,
        0 0 22px rgba(96, 213, 255, 0.2),
        0 0 90px rgba(34, 155, 232, 0.16),
        0 22px 65px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(32px) saturate(135%);
      -webkit-backdrop-filter: blur(32px) saturate(135%);
    }

    .glass-panel::before,
    .glass-panel::after {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      content: "";
      border-radius: inherit;
    }

    .glass-panel::before {
      inset: 7px;
      border: 1px solid rgba(212, 245, 255, 0.14);
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.075), transparent 38%, rgba(104, 216, 255, 0.035));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.035) inset;
    }

    .glass-panel::after {
      top: 0;
      left: 10%;
      width: 52%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      box-shadow: 0 0 15px rgba(180, 239, 255, 0.75);
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .loading-label {
      margin: 0;
      color: rgba(242, 251, 255, 0.9);
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-shadow: 0 0 16px rgba(183, 237, 255, 0.38);
    }

    .spinner {
      width: 1.75rem;
      height: 1.75rem;
      border: 1px solid rgba(219, 247, 255, 0.27);
      border-top-color: rgba(255, 255, 255, 0.98);
      border-right-color: rgba(144, 227, 255, 0.9);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 12px rgba(142, 227, 255, 0.32);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      :root {
        --panel-width: calc(100vw - 2rem);
      }

      main {
        padding: 1rem;
      }

      .brand {
        margin-bottom: 1rem;
        font-size: 1.15rem;
      }

      .glass-panel {
        min-height: 12rem;
        border-radius: 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Экран загрузки">
    <p class="brand">sosint.fun</p>
    <section class="glass-panel" aria-live="polite">
      <div class="loading-content">
        <p class="loading-label">ожидание...</p>
        <span class="spinner" role="status" aria-label="Загрузка"></span>
      </div>
    </section>
  </main>
</body>
</html>
